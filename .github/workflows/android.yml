# Builds the app and publishes it by itself.
#   Every push to main that changes the app: a new release (version <versionName>.<run number>, like 3.0.12) with the
#   APK, which phones with the GitHub build download and install by themselves, and the Google Play bundle (sent to
#   Google Play too when PLAY_SERVICE_ACCOUNT_JSON is set). Put [skip release] in the commit message for a test build.
#   Actions > Android > Run workflow: a release now (the next number, or the version you type, like 3.1.0).
#   A tag works too: git tag v3.1.0 && git push origin v3.1.0
#   Without the keystore secrets there are only test builds (signed with a throwaway key).
#
# Repository settings > Secrets and variables > Actions:
#   secret   KEYSTORE_BASE64             base64 of autoapply.jks (never commit the keystore)
#   secret   KS_PASS                     the keystore password
#   variable SERVER_URL                  optional: the server built into the app (default https://145-241-153-177.sslip.io)
#   secret   PLAY_SERVICE_ACCOUNT_JSON   optional: a Google Play service account key, to upload releases to Play
#   variable PLAY_TRACK                  optional: internal (default), alpha (closed testing), beta or production
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "!android/**/*.md", "!android/test/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, like 3.1.0 (empty: the next number)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt dalvik-exchange zipalign apksigner
          ls "$ANDROID_HOME/platforms/android-34/android.jar" || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar

      - name: Version
        id: v
        env:
          REL: ${{ inputs.release }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          BASE="$(grep -o 'versionName="[^"]*"' AndroidManifest.xml | cut -d'"' -f2)"
          AUTO=""
          if [ -n "$REL" ]; then NAME="${REL#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] \
            || { [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && ! grep -qiF '[skip release]' <<<"$MSG"; }; then
            NAME="$BASE.${{ github.run_number }}"
            AUTO=1
          fi
          if [ -n "${NAME:-}" ]; then
            [[ "$NAME" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::A version looks like 3.1.0, not '$NAME'."; exit 1; }
            echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          else
            NAME="$BASE-dev.${{ github.run_number }}"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
          echo "auto=$AUTO" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          TAG: ${{ steps.v.outputs.tag }}
          AUTO: ${{ steps.v.outputs.auto }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/autoapply.jks
            echo "real=yes" >> "$GITHUB_OUTPUT"
            echo "release=$TAG" >> "$GITHUB_OUTPUT"
          elif [ -n "$TAG" ] && [ -z "$AUTO" ]; then
            echo "::error::A release needs the KEYSTORE_BASE64 and KS_PASS secrets (see README)."
            exit 1
          else
            echo "::warning::No KEYSTORE_BASE64 secret: a test build signed with a throwaway key (it cannot update an installed app). Releases start once the KEYSTORE_BASE64 and KS_PASS secrets are set."
            echo "real=no" >> "$GITHUB_OUTPUT"
            echo "release=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK (GitHub) and AAB (Google Play)
        env:
          KS_PASS: ${{ secrets.KS_PASS || 'autoapply' }}
          NEW_KEY: ${{ steps.key.outputs.real == 'no' && '1' || '' }}
          SERVER_URL: ${{ vars.SERVER_URL || 'https://145-241-153-177.sslip.io' }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar" BUNDLETOOL="$RUNNER_TEMP/bundletool.jar"
          ./build.sh
          FLAVOR=play ./build.sh
          SUFFIX=$([ -n "$NEW_KEY" ] && echo "-testkey" || true)
          mkdir -p ../dist
          cp out/github/AutoApply.apk "../dist/AutoApply-$VERSION_NAME$SUFFIX.apk"
          cp out/play/AutoApply.aab "../dist/AutoApply-$VERSION_NAME$SUFFIX-play.aab"
          rm -f keystore/autoapply.jks

      - uses: actions/upload-artifact@v4
        with:
          name: AutoApply-${{ steps.v.outputs.name }}
          path: dist/*

      - name: Release
        if: steps.key.outputs.release != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.key.outputs.release }}
          NAME: ${{ steps.v.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber        # a release made on github.com: add the files
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Auto Apply $NAME" --generate-notes
          fi

      - name: Google Play upload set up?
        id: play
        if: steps.key.outputs.release != ''
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "ready=$([ -n "$PLAY_JSON" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        if: steps.key.outputs.release != '' && steps.play.outputs.ready == 'yes'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.autoapply.bot
          releaseFiles: dist/*-play.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}
