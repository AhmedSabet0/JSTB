# Builds the app, checks it on Android emulators, and publishes it by itself.
#   Every push to main that changes the app: a new release (version <versionName>.<run number>, like 3.0.12) with the
#   APK, which phones with the GitHub build download and install by themselves, and the Google Play bundle (sent to
#   Google Play too when PLAY_SERVICE_ACCOUNT_JSON is set). Put [skip release] in the commit message for a test build.
#   Actions > Android > Run workflow: a release now (the next number, or the version you type, like 3.1.0).
#   A tag works too: git tag v3.1.0 && git push origin v3.1.0
#   Nothing is published unless the app opens and keeps running on the emulators (Android 12, 14 and 16).
#   Without the keystore secrets there are only test builds (signed with a throwaway key).
#
# Repository settings > Secrets and variables > Actions:
#   secret   KEYSTORE_BASE64             base64 of autoapply.jks (never commit the keystore)
#   secret   KS_PASS                     the keystore password
#   variable SERVER_URL                  optional: the server built into the app (default https://145-241-153-177.sslip.io)
#   secret   PLAY_SERVICE_ACCOUNT_JSON   optional: a Google Play service account key, to upload releases to Play
#   variable PLAY_TRACK                  optional: internal (default), alpha (closed testing), beta or production
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "!android/**/*.md", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, like 3.1.0 (empty: the next number)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.key.outputs.release }}
      name: ${{ steps.v.outputs.name }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt dalvik-exchange zipalign apksigner
          ls "$ANDROID_HOME/platforms/android-34/android.jar" || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar

      - name: Version
        id: v
        env:
          REL: ${{ inputs.release }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          BASE="$(grep -o 'versionName="[^"]*"' AndroidManifest.xml | cut -d'"' -f2)"
          AUTO=""
          if [ -n "$REL" ]; then NAME="${REL#v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] \
            || { [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && ! grep -qiF '[skip release]' <<<"$MSG"; }; then
            NAME="$BASE.${{ github.run_number }}"
            AUTO=1
          fi
          if [ -n "${NAME:-}" ]; then
            [[ "$NAME" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "::error::A version looks like 3.1.0, not '$NAME'."; exit 1; }
            echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          else
            NAME="$BASE-dev.${{ github.run_number }}"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
          echo "auto=$AUTO" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          TAG: ${{ steps.v.outputs.tag }}
          AUTO: ${{ steps.v.outputs.auto }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/autoapply.jks
            echo "real=yes" >> "$GITHUB_OUTPUT"
            echo "release=$TAG" >> "$GITHUB_OUTPUT"
          elif [ -n "$TAG" ] && [ -z "$AUTO" ]; then
            echo "::error::A release needs the KEYSTORE_BASE64 and KS_PASS secrets (see README)."
            exit 1
          else
            echo "::warning::No KEYSTORE_BASE64 secret: a test build signed with a throwaway key (it cannot update an installed app). Releases start once the KEYSTORE_BASE64 and KS_PASS secrets are set."
            echo "real=no" >> "$GITHUB_OUTPUT"
            echo "release=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK (GitHub) and AAB (Google Play)
        env:
          KS_PASS: ${{ secrets.KS_PASS || 'autoapply' }}
          NEW_KEY: ${{ steps.key.outputs.real == 'no' && '1' || '' }}
          SERVER_URL: ${{ vars.SERVER_URL || 'https://145-241-153-177.sslip.io' }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar" BUNDLETOOL="$RUNNER_TEMP/bundletool.jar"
          ./build.sh
          FLAVOR=play ./build.sh
          SUFFIX=$([ -n "$NEW_KEY" ] && echo "-testkey" || true)
          mkdir -p ../dist ../dist-play
          cp out/github/AutoApply.apk "../dist/AutoApply-$VERSION_NAME$SUFFIX.apk"
          cp out/play/AutoApply.aab "../dist/AutoApply-$VERSION_NAME$SUFFIX-play.aab"
          # The Google Play build as an APK too, for the emulator check
          java -jar "$BUNDLETOOL" build-apks --bundle=out/play/AutoApply.aab --output=out/play/app.apks --mode=universal \
            --ks=keystore/autoapply.jks --ks-pass="pass:$KS_PASS" --ks-key-alias=autoapply --key-pass="pass:$KS_PASS"
          (cd out/play && unzip -q -o app.apks universal.apk) && cp out/play/universal.apk ../dist-play/AutoApply-play.apk
          rm -f keystore/autoapply.jks

      - uses: actions/upload-artifact@v4
        with:
          name: AutoApply-${{ steps.v.outputs.name }}
          path: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: play-apk
          path: dist-play/*

  # The app must open and keep running: installed on emulators, opened, sent to the background and back.
  check:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 31, build: github }
          - { api: 34, build: github }
          - { api: 36, build: github }
          - { api: 36, build: play }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.build == 'play' && 'play-apk' || format('AutoApply-{0}', needs.build.outputs.name) }}
          path: apk

      - name: Only the app to check
        run: rm -f apk/*.aab && ls -la apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the app on Android ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/test/smoke.sh apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.build }}-android-${{ matrix.api }}
          path: |
            apk/*.txt
            apk/*.png

  release:
    needs: [build, check]
    if: needs.build.outputs.release != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AutoApply-${{ needs.build.outputs.name }}
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release }}
          NAME: ${{ needs.build.outputs.name }}
        run: |
          # GitHub's API sometimes answers 500/502: try a few times (an existing release only gets the files added)
          for try in 1 2 3 4 5; do
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY" && exit 0
            else
              gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Auto Apply $NAME" --generate-notes -R "$GITHUB_REPOSITORY" && exit 0
            fi
            echo "Try $try failed; trying again in $((try * 15)) seconds"
            sleep $((try * 15))
          done
          exit 1

      - name: Google Play upload set up?
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "ready=$([ -n "$PLAY_JSON" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        if: steps.play.outputs.ready == 'yes'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.autoapply.bot
          releaseFiles: dist/*-play.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}
