# Builds the app. Every push: a test build (artifacts). A tag like v2.1: the release with the APK (the app's updater
# reads it) and the Google Play bundle.
#
# Repository settings > Secrets and variables > Actions:
#   secret   KEYSTORE_BASE64  base64 of keystore/autoapply.jks (never commit the keystore)
#   secret   KS_PASS          the keystore password
#   variable SERVER_URL       https://your-server (built into the app)
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt dalvik-exchange zipalign apksigner
          ls "$ANDROID_HOME/platforms/android-34/android.jar" || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34"
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/autoapply.jks
          test -s keystore/autoapply.jks || { echo "Add the KEYSTORE_BASE64 secret"; exit 1; }

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="$(grep -o 'versionName="[^"]*"' AndroidManifest.xml | cut -d'"' -f2)-dev.${{ github.run_number }}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"

      - name: Build APK (GitHub) and AAB (Google Play)
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          SERVER_URL: ${{ vars.SERVER_URL }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar" BUNDLETOOL="$RUNNER_TEMP/bundletool.jar"
          ./build.sh
          FLAVOR=play ./build.sh
          mkdir -p ../dist
          cp out/github/AutoApply.apk "../dist/AutoApply-$VERSION_NAME.apk"
          cp out/play/AutoApply.aab "../dist/AutoApply-$VERSION_NAME-play.aab"
          rm -f keystore/autoapply.jks

      - uses: actions/upload-artifact@v4
        with:
          name: AutoApply-${{ steps.v.outputs.name }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Auto Apply ${GITHUB_REF_NAME#v}" --generate-notes
